project_id = "althius"

[db]
# Mesma versão do Postgres do projeto remoto.
major_version = 17

[functions.sender-accounts]
verify_jwt = true

[functions.unipile-account-status]
verify_jwt = false

# Chamada pelo próprio banco (pg_cron + pg_net), sem JWT: a função confere o token que o banco guarda.
[functions.sequence-runner]
verify_jwt = false

[functions.workspace-invitation-email]
verify_jwt = true

[functions.contact-photo-lookup]
verify_jwt = true

# Chamada pelo próprio banco (pg_cron + pg_net), sem JWT: a função confere o token que o banco guarda.
[functions.storage-purge]
verify_jwt = false

# Recebe o CSV da importação com o JWT do navegador; o banco confere a Participação ativa.
[functions.csv-import]
verify_jwt = true

# Recebe o pedido a um Agente com o JWT do navegador; o banco confere a Participação ativa, e a Execução segue depois
# da resposta.
[functions.agent-conversation]
verify_jwt = true

# Só o servidor chama, com a chave de serviço no cabeçalho (o gateway confere que é um JWT; a função confere que é a chave).
[functions.signal-scan]
verify_jwt = true

# Chamada pelo próprio banco (pg_cron + pg_net), sem JWT: a função confere o token que o banco guarda.
[functions.signal-runner]
verify_jwt = false

# Assinatura pelo Stripe (creditos-e-planos 05 e 06): o navegador pede checkout, portal e ajuste de assentos com o JWT;
# o Stripe chama o webhook sem JWT, e a função confere a assinatura Stripe-Signature.
[functions.stripe-billing]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

# Conexões funcionais (conexoes-funcionais 03): o participante conecta o próprio Acesso a uma Integração e vê as ferramentas
# dela com o JWT do navegador; o banco confere a Participação ativa e a habilitação. O retorno do OAuth chega do app de
# autorização sem JWT (redirecionamento do navegador): a função só aceita um `state` que casa com uma tentativa pendente.
[functions.integration-connect]
verify_jwt = true

[functions.integration-callback]
verify_jwt = false

[functions.integration-tools]
verify_jwt = true

# O gerador das Propostas de resposta (canais-08): chamado pelo próprio banco (pg_cron + pg_net), sem JWT; a função confere
# o token que o banco guarda (reply_proposal_runner_token_matches).
[functions.reply-proposal-runner]
verify_jwt = false

# O envio da resposta aprovada (canais-09): o titular chama com o JWT; o banco confere Participação, responsabilidade e Aprovação.
[functions.reply-proposal-send]
verify_jwt = true

# Enviar ao CRM (kanban 05): o Vendedor responsável chama com o JWT; o banco confere Participação, responsabilidade e Acesso.
[functions.crm-handoff]
verify_jwt = true
