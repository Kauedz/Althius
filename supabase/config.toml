project_id = "althius"

[db]
# Mesma versão do Postgres do projeto remoto.
major_version = 17

[functions.sender-accounts]
verify_jwt = true

[functions.unipile-account-status]
verify_jwt = false

# Chamada pelo próprio banco (pg_cron + pg_net), sem JWT: a função confere o token que o banco guarda.
[functions.sequence-runner]
verify_jwt = false

[functions.workspace-invitation-email]
verify_jwt = true

# Pedido de Sinal à equipe (PR-A): o navegador chama com o JWT; o banco reserva o aviso uma vez.
[functions.signal-request-notify]
verify_jwt = true

# Pedido de acesso do visitante (acesso-e-planos): o navegador chama com o JWT; o banco reserva o aviso uma vez e limita os envios por usuário.
[functions.access-request-notify]
verify_jwt = true

[functions.contact-photo-lookup]
verify_jwt = true

# Chamada pelo próprio banco (pg_cron + pg_net), sem JWT: a função confere o token que o banco guarda.
[functions.storage-purge]
verify_jwt = false

# Recebe o CSV da importação com o JWT do navegador; o banco confere a Participação ativa.
[functions.csv-import]
verify_jwt = true

# Recebe o pedido a um Agente com o JWT do navegador; o banco confere a Participação ativa, e a Execução segue depois
# da resposta.
[functions.agent-conversation]
verify_jwt = true

# Só o servidor chama, com a chave de serviço no cabeçalho (o gateway confere que é um JWT; a função confere que é a chave).
[functions.signal-scan]
verify_jwt = true

# Chamada pelo próprio banco (pg_cron + pg_net), sem JWT: a função confere o token que o banco guarda.
[functions.signal-runner]
verify_jwt = false

# A busca de Sinais por cascata, pedida pelo worker do Hermes com a chave de serviço (o gateway confere que é um JWT; a
# função confere o papel de serviço). Roda o mesmo motor do signal-runner, com as contas do Apify que só existem nos segredos.
[functions.signal-cascade]
verify_jwt = true

# Assinatura pelo Stripe (creditos-e-planos 05 e 06): o navegador pede checkout, portal e ajuste de assentos com o JWT;
# o Stripe chama o webhook sem JWT, e a função confere a assinatura Stripe-Signature.
[functions.stripe-billing]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

# Conexões funcionais (conexoes-funcionais 03): o participante conecta o próprio Acesso a uma Integração e vê as ferramentas
# dela com o JWT do navegador; o banco confere a Participação ativa e a habilitação. O retorno do OAuth chega do app de
# autorização sem JWT (redirecionamento do navegador): a função só aceita um `state` que casa com uma tentativa pendente.
[functions.integration-connect]
verify_jwt = true

[functions.integration-callback]
verify_jwt = false

[functions.integration-tools]
verify_jwt = true

# O Canal Slack (slack-canal 01): o Administrador instala e retira com o JWT do navegador; o banco confere que é
# Administrador ativo. O retorno da instalação chega do Slack sem JWT: a função só aceita um `state` de uso único.
[functions.slack-channel-connect]
verify_jwt = true

[functions.slack-channel-callback]
verify_jwt = false

# O gerador das Propostas de resposta (canais-08): chamado pelo próprio banco (pg_cron + pg_net), sem JWT; a função confere
# o token que o banco guarda (reply_proposal_runner_token_matches).
[functions.reply-proposal-runner]
verify_jwt = false

# O envio da resposta aprovada (canais-09): o titular chama com o JWT; o banco confere Participação, responsabilidade e Aprovação.
[functions.reply-proposal-send]
verify_jwt = true

# Enviar ao CRM (kanban 05): o Vendedor responsável chama com o JWT; o banco confere Participação, responsabilidade e Acesso.
[functions.crm-handoff]
verify_jwt = true

# Anexos dos passos da Sequência (canais-10): o titular sobe o arquivo e abre por URL assinada curta.
[functions.sequence-attachments]
verify_jwt = true

[functions.agent-attachments]
verify_jwt = true

# O aviso a quem tenta se cadastrar com um e-mail que já tem conta (auth 03): quem chama ainda não tem sessão, e a chave
# publicável (sb_publishable_…) não é JWT. A função responde sempre igual; o banco confere a conta e limita os avisos.
[functions.existing-account-email]
verify_jwt = false

# A troca de senha em Meu perfil (CRM-08): o navegador chama com o JWT da sessão; a função identifica a Conta de usuário
# por ele, confere a senha atual ou o código no Supabase Auth e só então troca a senha. README em account-password/.
[functions.account-password]
verify_jwt = true

[auth.email]
# "Secure password change": trocar a senha por uma sessão aberta há mais de 24 horas exige reautenticação. A troca em
# Meu perfil passa pela account-password, que confirma a pessoa e troca com a sessão nova da confirmação. A exigência
# da senha atual ("Require current password when updating") não tem chave no config do CLI 2.118: liga-se no painel
# (ver supabase/functions/account-password/README.md).
secure_password_change = true
