name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projeto-althius-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projeto-althius-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  banco:
    name: Banco (migrations do zero e pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      # Só o banco e o Auth: as migrations do Auth criam as colunas de auth.users que os testes usam.
      - name: Supabase local com as migrations aplicadas do zero
        run: supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Testes pgTAP
        run: supabase test db

  funcoes:
    name: Edge Functions (Deno check e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # As Edge Functions recebem a Unipile e o banco por injeção de dependência; os testes vão da requisição
      # à resposta sem rede.
      - run: deno check supabase/functions/*/index.ts
      - run: deno test supabase/functions
      - run: deno test scripts/admin/limpar-sequencias-orfas.test.ts
      # Ninguém escreve o endereço da Unipile nem lê a chave da variável de função (canais-16): lê arquivos, então precisa de --allow-read.
      - run: deno test --allow-read=supabase/functions supabase/functions/_shared/unipile/sem-base-fixa.test.ts
      # Os testes do Mapa de Sinais, dos ICPs C, G e H, da nota da Descoberta e do Plano do Sinal leem as migrações (provam que o código e o banco combinam): precisam de --allow-read.
      - run: deno test --allow-read=supabase/migrations,supabase/functions supabase/functions/_shared/mapa-de-sinais.test.ts supabase/functions/_shared/cascata-de-sinais/passos/icp-c.test.ts supabase/functions/_shared/cascata-de-sinais/passos/icp-g.test.ts supabase/functions/_shared/cascata-de-sinais/passos/icp-h.test.ts supabase/functions/account-discovery/pontuacao-nota.test.ts supabase/functions/_shared/plano-do-sinal/migration.test.ts
