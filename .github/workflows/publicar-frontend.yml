name: Publicar frontend

# Publica app.althius.com.br depois que o CI passa num push na main. Quem faz o trabalho é o
# /opt/althius-web/publish.sh na VPS da Hostinger (fetch, build, backup, troca do dist, conferência e
# rollback); aqui só abrimos o SSH e chamamos o script. Ver docs/agents/publicacao.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez; a que chega depois espera a anterior terminar em vez de cancelá-la no meio da troca do dist.
concurrency:
  group: publicar-frontend
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar na VPS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # O publish.sh publica a ponta da main. Se a main já andou, o CI do commit mais novo chama a sua publicação;
      # esta não publica um commit cujo CI ainda não terminou.
      - name: Conferir que o commit do CI ainda é a ponta da main
        id: ponta
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_DO_CI: ${{ github.event.workflow_run.head_sha }}
        run: |
          ponta=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$ponta" != "$SHA_DO_CI" ]; then
            echo "A main está em $ponta e o CI verde é de $SHA_DO_CI; a publicação fica para o CI de $ponta."
            echo "pular=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar a chave e o known_hosts
        if: steps.ponta.outputs.pular != 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # O publish.sh exige SSH_AUTH_SOCK; o agente fica no runner e é encaminhado com -A.
          eval "$(ssh-agent -s)"
          printf '%s\n' "$VPS_SSH_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      # Na VPS, a chave só pode rodar este comando (command= no authorized_keys); o comando abaixo é o mesmo.
      - name: Rodar o publish.sh
        if: steps.ponta.outputs.pular != 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -A -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "root@$VPS_HOST" /opt/althius-web/publish.sh main

      - name: Conferir o que está no ar
        if: steps.ponta.outputs.pular != 'true'
        run: |
          curl -fsS -o /dev/null -w 'index.html: HTTP %{http_code}\n' https://app.althius.com.br/
          curl -fsSI https://app.althius.com.br/ | grep -i '^cache-control' || echo "index.html ainda sem Cache-Control (Caddyfile da VPS sem a mudança)."

      - name: Encerrar o agente
        if: always()
        run: '[ -z "${SSH_AGENT_PID:-}" ] || ssh-agent -k'
